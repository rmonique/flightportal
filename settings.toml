# This file is where you keep secret settings, passwords, and tokens!
# If you put them in the code you risk committing that info or sharing it
CIRCUITPY_WIFI_SSID = "wifi network"
CIRCUITPY_WIFI_PASSWORD = "wifi password"

# Area to search for flights: top latitude, bottom latitude, left longitude, right longitude
# (so this example is central London). Keep it small - roughly what you can see from your window.
BOUNDS_BOX = "51.6,51.4,-0.3,-0.1"

# Optional: ignore flights above this altitude in feet, e.g. 15000. 0 = show any altitude.
# When several flights are in the box, the lowest one is shown.
MAX_ALTITUDE = 0

# Optional: "True" or "False" to enable or disable the status LED
STATUS_LEDS = "True"

# Optional clock and night mode. Both need UTC_OFFSET: your standard-time offset from UTC in hours
# (e.g. "-5" US Eastern, "-8" US Pacific, "0" UK, "1" central Europe, "5.5" India).
# DST_RULE is "US", "EU" or "none" for when clocks go forward.
UTC_OFFSET = "0"
DST_RULE = "EU"
# Show the time and date when no flight is overhead, and 12 or 24 hour format
SHOW_CLOCK = "True"
CLOCK_24H = "True"
# The edge of the display fills up over each minute, like a second hand
SECONDS_RING = "True"
# Night mode: between these hours (0-23, local time) don't look up flights. Remove or set to -1 to disable.
NIGHT_START = 23
NIGHT_END = 6
# At night show a dim clock ("True") or turn the display off ("False")
NIGHT_CLOCK = "True"
